name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      etassia_ref:
        description: etassia/etassia ref that generates the goldens
        default: main
env:
  ETASSIA_REF: ${{ inputs.etassia_ref || vars.ETASSIA_REF || 'main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows git defaults to core.autocrlf=true, which would turn the etassia
      # corpus (.mmd) into CRLF; Rust declines CRLF sources (Unported) while Ruby
      # renders them, so the byte-match fails. Keep LF.
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: etassia/etassia
          ref: ${{ env.ETASSIA_REF }}
          path: etassia
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: etassia
      # Goldens are generated by Ruby on THIS OS: Ruby calls the platform libm
      # (Math.sin etc.), so Rust must match Ruby on the same machine.
      - name: Generate goldens with Ruby
        shell: bash
        working-directory: etassia
        env:
          GOLDEN_OUT: ${{ runner.temp }}/golden
        run: bundle exec ruby ../scripts/golden_generate.rb
      - name: cargo test --workspace
        shell: bash
        env:
          ETASSIA_GOLDEN_DIR: ${{ runner.temp }}/golden
          ETASSIA_RUBY_DIR: ${{ github.workspace }}/etassia
        run: cargo test --workspace -- --nocapture
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: etassia/etassia
          ref: ${{ env.ETASSIA_REF }}
          path: etassia
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: etassia
      - name: Generate goldens with Ruby
        shell: bash
        working-directory: etassia
        env:
          GOLDEN_OUT: ${{ runner.temp }}/golden
        run: bundle exec ruby ../scripts/golden_generate.rb
      - name: Build and test the Python binding
        shell: bash
        working-directory: bindings/python
        env:
          ETASSIA_GOLDEN_DIR: ${{ runner.temp }}/golden
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          pip install maturin pytest
          maturin develop --release
          pytest -q -s
  ts:
    # etassia-ts: etassia-rs compiled to wasm, every golden case byte-compared.
    # Math is js_math.rs on every target, so wasm must equal Ruby with no allowlist.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: etassia/etassia
          ref: ${{ env.ETASSIA_REF }}
          path: etassia
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: etassia
      - name: Generate goldens with Ruby
        shell: bash
        working-directory: etassia
        env:
          GOLDEN_OUT: ${{ runner.temp }}/golden
        run: bundle exec ruby ../scripts/golden_generate.rb
      - name: npm ci
        working-directory: bindings/ts
        run: npm ci
      - name: Build wasm + run golden byte-compare
        working-directory: bindings/ts
        env:
          ETASSIA_GOLDEN_DIR: ${{ runner.temp }}/golden
        run: npm test
