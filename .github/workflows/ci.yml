name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sirena_ref:
        description: claricle/sirena ref that generates the goldens
        default: main
env:
  SIRENA_REF: ${{ inputs.sirena_ref || vars.SIRENA_REF || 'main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows git defaults to core.autocrlf=true, which would turn the sirena
      # corpus (.mmd) into CRLF; Rust declines CRLF sources (Unported) while Ruby
      # renders them, so the byte-match fails. Keep LF.
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: claricle/sirena
          ref: ${{ env.SIRENA_REF }}
          path: sirena
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sirena
      # Goldens are generated by Ruby on THIS OS: Ruby calls the platform libm
      # (Math.sin etc.), so Rust must match Ruby on the same machine.
      - name: Generate goldens with Ruby
        shell: bash
        working-directory: sirena
        env:
          GOLDEN_OUT: ${{ runner.temp }}/golden
        run: bundle exec ruby ../scripts/golden_generate.rb
      - name: cargo test --workspace
        shell: bash
        env:
          SIRENA_GOLDEN_DIR: ${{ runner.temp }}/golden
          SIRENA_RUBY_DIR: ${{ github.workspace }}/sirena
        run: cargo test --workspace -- --nocapture
