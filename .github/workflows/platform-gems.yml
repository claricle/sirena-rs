name: platform-gems

# Builds the precompiled sirena-native platform gems and installs each one into
# a clean GEM_HOME to render a golden. The gem is an FFI gem over the sirena-ffi
# cdylib, so there is no Ruby extension: no rb-sys / cross-gem toolchain, and
# nothing compiles at install. Build-only: nothing here publishes a gem;
# release.yml calls this workflow and publishes the `gem-*` artifacts.
on:
  pull_request:
    paths:
      - "bindings/ruby/**"
      - "crates/**"
      - "Cargo.*"
      - ".github/workflows/platform-gems.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: platform-gems-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLDEN_MMD: golden/pie/pie_spec-0b1f3197.mmd
  GOLDEN_SVG: golden/pie/pie_spec-0b1f3197.svg

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, lib: libsirena_ffi.so }
          - { platform: aarch64-linux, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, lib: libsirena_ffi.so }
          - { platform: arm64-darwin, os: macos-15, target: aarch64-apple-darwin, lib: libsirena_ffi.dylib }
          - { platform: x86_64-darwin, os: macos-15-intel, target: x86_64-apple-darwin, lib: libsirena_ffi.dylib }
          - { platform: x64-mingw-ucrt, os: windows-latest, target: x86_64-pc-windows-msvc, lib: sirena_ffi.dll }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build cdylib
        env:
          # Windows: link the CRT statically so the DLL needs no VC redistributable.
          RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p sirena-ffi --target ${{ matrix.target }}
      - name: Package platform gem
        working-directory: bindings/ruby
        run: ruby scripts/build_platform_gem.rb ${{ matrix.platform }} ../../target/${{ matrix.target }}/release/${{ matrix.lib }}
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: bindings/ruby/pkg/*.gem
          if-no-files-found: error
      - name: Smoke the installed gem
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gem install --no-document --install-dir "$work/gems" bindings/ruby/pkg/sirena-native-*-${{ matrix.platform }}.gem
          export GEM_HOME="$work/gems" GEM_PATH="$work/gems"
          cp "$GOLDEN_MMD" "$GOLDEN_SVG" "$work/"
          cd "$work"
          ruby -rsirena/native "$GITHUB_WORKSPACE/bindings/ruby/scripts/smoke_installed_gem.rb" native "$work/$(basename "$GOLDEN_MMD")" "$work/$(basename "$GOLDEN_SVG")"

  # Alpine runs a musl Ruby, so the musl cdylib is built and smoked in a musl
  # container (a musl cdylib needs a dynamic CRT, which Alpine's rust provides).
  # Plain docker run keeps JavaScript actions off the Alpine image.
  musl:
    name: x86_64-linux-musl
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build, package and smoke in Alpine
        run: |
          docker run --rm -e GOLDEN_MMD -e GOLDEN_SVG -v "$PWD:/w" -w /w ruby:3.4-alpine sh -euxc '
            apk add --no-cache build-base cargo
            cargo build --release -p sirena-ffi
            cd bindings/ruby
            ruby scripts/build_platform_gem.rb x86_64-linux-musl ../../target/release/libsirena_ffi.so
            work="$(mktemp -d)"
            gem install --no-document --install-dir "$work/gems" pkg/sirena-native-*-x86_64-linux-musl.gem
            cp ../../$GOLDEN_MMD ../../$GOLDEN_SVG "$work/"
            cd "$work"
            GEM_HOME="$work/gems" GEM_PATH="$work/gems" ruby -rsirena/native /w/bindings/ruby/scripts/smoke_installed_gem.rb native "$work/$(basename $GOLDEN_MMD)" "$work/$(basename $GOLDEN_SVG)"
          '
        env:
          GOLDEN_MMD: ${{ env.GOLDEN_MMD }}
          GOLDEN_SVG: ${{ env.GOLDEN_SVG }}
      - uses: actions/upload-artifact@v4
        with:
          name: gem-x86_64-linux-musl
          path: bindings/ruby/pkg/*.gem
          if-no-files-found: error

  # The ruby-platform gem: no library inside, falls back to pure Ruby.
  pure:
    name: ruby (pure fallback)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build and smoke the pure gem
        run: |
          set -euo pipefail
          (cd bindings/ruby && gem build sirena-native.gemspec && mkdir -p pkg && mv sirena-native-*.gem pkg/)
          work="$(mktemp -d)"
          gem install --no-document --install-dir "$work/gems" bindings/ruby/pkg/sirena-native-[0-9]*[0-9].gem
          cp "$GOLDEN_MMD" "$GOLDEN_SVG" "$work/"
          cd "$work"
          GEM_HOME="$work/gems" GEM_PATH="$work/gems" ruby -rsirena/native "$GITHUB_WORKSPACE/bindings/ruby/scripts/smoke_installed_gem.rb" fallback "$work/$(basename "$GOLDEN_MMD")" "$work/$(basename "$GOLDEN_SVG")"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: bindings/ruby/pkg/*.gem
          if-no-files-found: error
