name: release

# One workflow publishes all three packages, so each registry's trusted
# publisher is configured against a single workflow file (release.yml).
#
# Trigger: push a tag `etassia-native-vX.Y.Z`, `etassia-py-vX.Y.Z` or
# `etassia-ts-vX.Y.Z`. The tag publishes only its own package, and its version
# must equal the version in that package's manifest (no version bump happens
# here). workflow_dispatch with `publish: false` (default) builds and smokes the
# package without uploading it; a real publish needs a tag ref. Never runs on PRs.
on:
  push:
    tags:
      - "etassia-native-v*"
      - "etassia-py-v*"
      - "etassia-ts-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to build (published only when `publish` is true and the ref is its tag)
        type: choice
        options: [etassia-native, etassia-py, etassia-ts]
        required: true
      publish:
        description: Publish to the registry (the ref must be a matching tag)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.p.outputs.package }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            package="${REF_NAME%-v*}"; publish=true
          else
            package="$INPUT_PACKAGE"; publish="$INPUT_PUBLISH"
          fi
          if [ "$publish" = true ]; then
            [ "$REF_TYPE" = tag ] || { echo "::error::publishing needs a tag ref, got $REF_TYPE $REF_NAME"; exit 1; }
            [ "${REF_NAME%-v*}" = "$package" ] || { echo "::error::tag $REF_NAME does not belong to $package"; exit 1; }
            version="${REF_NAME##*-v}"
            case "$package" in
              etassia-native) have=$(sed -n 's/^ *spec.version = "\(.*\)"/\1/p' bindings/ruby/etassia-native.gemspec) ;;
              etassia-py)     have=$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml) ;;
              etassia-ts)     have=$(node -p 'require("./bindings/ts/package.json").version') ;;
              *) echo "::error::unknown package $package"; exit 1 ;;
            esac
            [ "$have" = "$version" ] || { echo "::error::tag version $version != manifest version $have"; exit 1; }
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # ---- etassia-native (RubyGems) -------------------------------------------
  # The gem releases itself on the parsanol model (bindings/ruby
  # release.yml: cross-gem + bump-PR + TP); a etassia-native tag here is
  # no longer part of this pipeline.

  # ---- etassia-py (PyPI) ---------------------------------------------------
  build-wheels:
    needs: plan
    if: needs.plan.outputs.package == 'etassia-py'
    uses: ./.github/workflows/python-wheels.yml

  publish-wheels:
    name: publish wheels + sdist (PyPI)
    needs: [plan, build-wheels]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - run: ls -1 dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ---- etassia-ts (npm) ----------------------------------------------------
  build-npm:
    needs: plan
    if: needs.plan.outputs.package == 'etassia-ts'
    uses: ./.github/workflows/npm-package.yml

  publish-npm:
    name: publish etassia-ts (npm)
    needs: [plan, build-npm]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles an older npm.
      - run: npm install -g npm@^11.5.1
      - name: Publish with provenance
        run: npm publish ./tarball/etassia-ts-*.tgz --provenance --access public
