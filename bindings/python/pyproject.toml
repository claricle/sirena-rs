[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "etassia-py"
version = "0.0.0"
description = "Python binding for the etassia Rust runtime (Mermaid to SVG, byte-identical to the Ruby gem)"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }

[tool.maturin]
python-source = "python"
module-name = "etassia_py._native"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
